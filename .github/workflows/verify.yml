name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Install pinned local runtime
        run: python setup.py
      - name: Installer failure checks
        run: python test_setup.py
      - name: Real DLL and failure checks
        run: python test_compare.py
      - name: Additional package comparisons against pefix
        run: python verify_packages.py
      - name: Build source release
        run: python build_release.py
      - name: Test ZIP installation, public demo and offline repair
        run: python verify_portable.py
